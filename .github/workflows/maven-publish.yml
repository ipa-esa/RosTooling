# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Publish RosTooling to GitHub Packages

on:
  release:
    types: [created]
  # Beta channel: every push to devel publishes <major>.<minor+1>.0-SNAPSHOT (e.g.
  # 3.7.0-SNAPSHOT). No other branch and no manual run publishes a SNAPSHOT. GitHub Packages
  # keeps every upload, timestamped, and Maven and Gradle resolve the newest one, so the
  # extension's pre-release job always gets the latest devel. Release versions are never
  # touched: the version change exists only in this run.
  push:
    branches: [devel]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN

    - name: Set up Maven 3.9.9
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: '3.9.9'
        
    # Tycho's version tool changes the POMs and the bundle manifests together (3.7.0-SNAPSHOT /
    # 3.7.0.qualifier), which Tycho requires to match.
    - name: Set beta SNAPSHOT version
      if: github.event_name == 'push' && github.ref == 'refs/heads/devel'
      run: |
        base=$(sed -n '0,/<version>/s:.*<version>\(.*\)</version>.*:\1:p' plugins/de.fraunhofer.ipa.ros.parent/pom.xml)
        major=${base%%.*}; rest=${base#*.}; minor=${rest%%.*}
        snapshot="${major}.$((minor + 1)).0-SNAPSHOT"
        tycho=$(sed -n 's:.*<tycho-version>\(.*\)</tycho-version>.*:\1:p' plugins/de.fraunhofer.ipa.ros.parent/pom.xml)
        ./mvnw -B -f plugins/de.fraunhofer.ipa.ros.parent/pom.xml \
          org.eclipse.tycho:tycho-versions-plugin:${tycho}:set-version -DnewVersion="$snapshot"
        echo "Beta version $snapshot (from $base, commit ${GITHUB_SHA::8})" >> "$GITHUB_STEP_SUMMARY"

    - name: Publish to GitHub Packages Apache Maven
      run: ./mvnw deploy -B -f plugins/de.fraunhofer.ipa.ros.parent/pom.xml
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ github.token }}
